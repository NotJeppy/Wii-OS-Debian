<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Internet</title>
<link rel="stylesheet" href="start.css">
</head>
<body>
  <header>
    <span class="globe" aria-hidden="true"></span>
    <h1>Internet</h1>
  </header>

  <form id="go" autocomplete="off">
    <input id="address" name="q" type="text" autofocus spellcheck="false"
           aria-label="Search or type a web address" placeholder="Search or type a web address">
  </form>

  <nav id="shortcuts">
    <a href="https://www.google.com/"><b>Google</b><span>google.com</span></a>
    <a href="https://en.wikipedia.org/"><b>Wikipedia</b><span>wikipedia.org</span></a>
    <a href="https://weather.com/"><b>Weather</b><span>weather.com</span></a>
    <a href="https://news.google.com/"><b>News</b><span>news.google.com</span></a>
    <a href="https://www.reddit.com/"><b>Reddit</b><span>reddit.com</span></a>
    <a href="https://www.espn.com/"><b>Sports</b><span>espn.com</span></a>
  </nav>

  <footer>
    <span class="key">R</span> point
    <span class="key">A</span> choose
    <span class="key">B</span> back
    <span class="key">Y</span> start page
    <span class="key">LB</span><span class="key">RB</span> scroll
    <span class="key">Home</span> close
  </footer>

<script src="start.js"></script>
</body>
</html>
