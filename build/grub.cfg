# UEFI boot menu for the Wii-OS ISO (replaces Debian's /boot/grub/grub.cfg).
if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  terminal_output gfxterm
fi

set timeout=8
set default=0
set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

menuentry "Install Wii-OS  (erases the disk you choose)" {
    linux  /install.amd/vmlinuz vga=788 preseed/file=/cdrom/preseed/wii-os.cfg @EXTRA@ --- quiet
    initrd /install.amd/gtk/initrd.gz
}
menuentry "Install Wii-OS  (text mode)" {
    linux  /install.amd/vmlinuz preseed/file=/cdrom/preseed/wii-os.cfg @EXTRA@ --- quiet
    initrd /install.amd/initrd.gz
}
