# Answers for the Debian installer on the Wii-OS ISO.
# Anything not answered here is still asked: language, keyboard, Wi-Fi,
# time zone, your account and password, which disk to use, and the final
# "write changes to disk?" confirmation.

# Network
d-i netcfg/get_hostname string wii-os
d-i netcfg/get_domain string
d-i netcfg/hostname string wii-os

# Package mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Accounts: no root password, so the user account gets sudo.
d-i passwd/root-login boolean false

# Disk: guided, whole disk, one partition. The installer still asks which
# disk (when there is more than one) and asks before writing anything.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/choose_label select gpt
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# Software: no desktop; Wii-OS is the interface.
tasksel tasksel/first multiselect standard
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Wii-OS itself: copy it from the USB stick and set it up.
d-i preseed/late_command string \
  cp -r /cdrom/wii-os /target/opt/wii-os; \
  in-target bash /opt/wii-os/system/install.sh

d-i finish-install/reboot_in_progress note
